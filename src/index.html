<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiteIDE</title>

<!-- Google Fonts: JetBrains Mono + Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- xterm.js (local) -->
<link rel="stylesheet" href="../node_modules/xterm/css/xterm.css">
<script src="../node_modules/xterm/lib/xterm.js"></script>
<script src="../node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<!-- Monaco loader (local) -->
<script src="../node_modules/monaco-editor/min/vs/loader.js"></script>

<style>
/* ═══════════════════════════════════════════
   RESET & ROOT
═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:          #06060e;
  --glass-bg:    rgba(14, 14, 26, 0.55);
  --glass-hi:    rgba(255,255,255,0.055);
  --glass-hi2:   rgba(255,255,255,0.09);
  --glass-b:     rgba(255,255,255,0.07);
  --glass-b-top: rgba(255,255,255,0.18);
  --blur:        blur(28px) saturate(200%) brightness(1.05);
  --blue:        #007AFF;
  --green:       #30D158;
  --red:         #FF453A;
  --orange:      #FF9F0A;
  --purple:      #BF5AF2;
  --t1:          rgba(255,255,255,0.92);
  --t2:          rgba(255,255,255,0.58);
  --t3:          rgba(255,255,255,0.30);
  --t4:          rgba(255,255,255,0.12);
  --sidebar-w:   228px;
  --titlebar-h:  46px;
  --terminal-h:  230px;
  --r:           12px;
  --r-sm:        8px;
  --r-xs:        5px;
  --trans:       cubic-bezier(0.4,0,0.2,1);
}

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background: var(--bg);
  color: var(--t1);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ═══════════════════════════════════════════
   ANIMATED BG BLOBS
═══════════════════════════════════════════ */
#bg {
  position:fixed; inset:0; z-index:0;
  pointer-events:none; overflow:hidden;
}
.blob {
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  will-change:transform;
  animation: floatBlob var(--dur,14s) ease-in-out infinite alternate;
}
.b1{width:600px;height:600px;background:radial-gradient(circle,#3b12e0 0%,transparent 70%);opacity:.3;top:-150px;left:-100px;--dur:16s;}
.b2{width:450px;height:450px;background:radial-gradient(circle,#0a5ef5 0%,transparent 70%);opacity:.25;top:25%;right:-80px;--dur:20s;animation-delay:-5s;}
.b3{width:380px;height:380px;background:radial-gradient(circle,#7c12d6 0%,transparent 70%);opacity:.22;bottom:-80px;left:28%;--dur:18s;animation-delay:-9s;}
.b4{width:300px;height:300px;background:radial-gradient(circle,#00a0e8 0%,transparent 70%);opacity:.18;bottom:15%;right:18%;--dur:22s;animation-delay:-3s;}

@keyframes floatBlob {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(35px,28px) scale(1.09); }
}

/* ═══════════════════════════════════════════
   APP SHELL — GRID
═══════════════════════════════════════════ */
#app {
  position:relative; z-index:1;
  display:grid;
  grid-template-rows: var(--titlebar-h) 1fr var(--terminal-h);
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-areas:
    "title  title"
    "side   editor"
    "side   term";
  width:100vw; height:100vh;
  background: rgba(255,255,255,0.025);
  gap: 1px;
}

/* ═══════════════════════════════════════════
   TITLEBAR
═══════════════════════════════════════════ */
#titlebar {
  grid-area:title;
  display:flex; align-items:center; gap:10px;
  padding: 0 14px;
  background: rgba(8,8,18,0.72);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-b);
  -webkit-app-region: drag;
}
#titlebar > * { -webkit-app-region: no-drag; }

/* traffic lights (non-mac) */
.wc { display:flex; gap:7px; align-items:center; }
.wc button {
  width:12px; height:12px; border-radius:50%;
  border:none; cursor:pointer;
  transition: filter .15s, transform .1s;
  flex-shrink:0;
}
.wc button:hover { filter:brightness(1.35); transform:scale(1.1); }
.wc .wc-close  { background:#FF5F57; }
.wc .wc-min    { background:#FFBD2E; }
.wc .wc-max    { background:#28CA42; }
.platform-mac .wc { display:none; }

/* Logo */
.logo {
  font-size:14px; font-weight:700; letter-spacing:-.4px;
  background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 60%, #34d399 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  flex-shrink:0;
}

/* breadcrumb */
#breadcrumb {
  font-size:11px; color:var(--t3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  flex:1; min-width:0;
}
#breadcrumb span { color:var(--t2); }

/* lang trigger pill */
#lang-trigger {
  display:flex; align-items:center; gap:7px;
  background:var(--glass-hi); border:1px solid var(--glass-b);
  border-top-color:var(--glass-b-top); border-radius:30px;
  padding:4px 11px 4px 9px; cursor:pointer; flex-shrink:0;
  transition: background .2s, box-shadow .2s;
  user-select:none;
}
#lang-trigger:hover { background:var(--glass-hi2); box-shadow:0 2px 12px rgba(0,0,0,.3); }
#lang-trigger #langName { font-size:12px; font-weight:500; color:var(--t1); }
.pill-arrow { color:var(--t3); font-size:9px; }
.ldot { width:7px; height:7px; border-radius:50%; flex-shrink:0; transition:background .3s; }
.ldot.ok      { background:var(--green); box-shadow:0 0 7px var(--green); }
.ldot.bad     { background:var(--red);   box-shadow:0 0 7px var(--red); }
.ldot.loading { background:var(--orange); animation:dotPulse 1s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:.35} 50%{opacity:1} }

/* install banner */
#installBanner {
  display:none; align-items:center; gap:6px;
  font-size:11px; font-weight:500; color:#fff;
  background:rgba(255,69,58,.18); border:1px solid rgba(255,69,58,.4);
  border-radius:20px; padding:4px 12px; cursor:pointer; flex-shrink:0;
  transition:background .2s;
}
#installBanner:hover { background:rgba(255,69,58,.30); }

/* lang dropdown */
#lang-menu {
  position:fixed; top:50px; left:50%; transform:translateX(-50%);
  width:520px; max-height:420px;
  background:rgba(12,12,24,0.95);
  backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  border:1px solid rgba(255,255,255,.1);
  border-top-color:rgba(255,255,255,.2);
  border-radius:var(--r);
  box-shadow:0 24px 60px rgba(0,0,0,.7);
  z-index:9000; display:none; flex-direction:column;
  overflow:hidden;
  animation:menuIn .18s cubic-bezier(.34,1.56,.64,1);
}
#lang-menu.open { display:flex; }
@keyframes menuIn { from{opacity:0;transform:translateX(-50%) scale(.96)} to{opacity:1;transform:translateX(-50%) scale(1)} }

#lang-search {
  width:100%; background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1); border-radius:var(--r-sm);
  padding:7px 12px; font-family:inherit; font-size:12px;
  color:var(--t1); outline:none;
}
#lang-search::placeholder { color:var(--t3); }

#lang-list {
  overflow-y:auto; padding:6px;
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:3px;
}

.li {
  display:flex; align-items:center; gap:8px;
  padding:7px 10px; border-radius:var(--r-xs);
  cursor:pointer; transition:background .12s;
  position:relative;
}
.li:hover { background:rgba(255,255,255,.07); }
.li.selected { background:rgba(0,122,255,.18); box-shadow:inset 0 0 0 1px rgba(0,122,255,.4); }
.li .li-icon { font-size:15px; flex-shrink:0; width:20px; text-align:center; }
.li .li-name { font-size:12px; font-weight:500; color:var(--t1); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.li .li-status { flex-shrink:0; display:flex; align-items:center; gap:4px; }
.li .li-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.li .li-dot.ok   { background:var(--green); }
.li .li-dot.bad  { background:var(--red); opacity:.7; }
.li .li-dot.spin { background:var(--orange); animation:dotPulse 1s ease-in-out infinite; }
.li .li-badge {
  font-size:9px; padding:1px 6px; border-radius:20px; font-weight:600;
  letter-spacing:.04em; white-space:nowrap;
}
.li .li-badge.ok  { background:rgba(48,209,88,.15); color:var(--green); }
.li .li-badge.bad { background:rgba(255,69,58,.15); color:var(--red); }
.li .li-get {
  font-size:9px; padding:1px 7px; border-radius:20px;
  background:rgba(0,122,255,.18); color:var(--blue);
  border:1px solid rgba(0,122,255,.35); cursor:pointer;
  transition:background .15s; white-space:nowrap;
}
.li .li-get:hover { background:rgba(0,122,255,.32); }

/* save badge */
#saveBadge {
  font-size:11px; color:var(--t3); flex-shrink:0;
  transition: color .3s;
}
#saveBadge.ok { color:var(--green); }

/* run button */
#runBtn {
  display:flex; align-items:center; gap:6px;
  background: var(--green);
  color:#000; border:none; border-radius:20px;
  padding: 5px 14px 5px 11px;
  font-family:inherit; font-size:12px; font-weight:700;
  cursor:pointer; flex-shrink:0;
  box-shadow: 0 0 18px rgba(48,209,88,.35);
  transition: all .2s var(--trans);
}
#runBtn:hover { background:#3adf64; transform:scale(1.04); box-shadow:0 0 28px rgba(48,209,88,.55); }
#runBtn:active { transform:scale(.96); }
#runBtn.stop { background:var(--red); box-shadow:0 0 18px rgba(255,69,58,.35); animation:runPulse 1.5s ease-in-out infinite; }
#runBtn.stop:hover { background:#ff6056; box-shadow:0 0 28px rgba(255,69,58,.55); }
@keyframes stdinBlink { 0%,100%{opacity:.5} 50%{opacity:1} }
@keyframes runPulse {
  0%,100% { box-shadow:0 0 18px rgba(255,69,58,.35); }
  50%      { box-shadow:0 0 34px rgba(255,69,58,.7); }
}
#runBtn svg { flex-shrink:0; }

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
#sidebar {
  grid-area:side;
  display:flex; flex-direction:column;
  background: rgba(8,8,18,0.62);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-right: 1px solid var(--glass-b);
  overflow:hidden;
}

.sb-head {
  padding: 10px 10px 8px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  flex-shrink:0;
}
.sb-row {
  display:flex; align-items:center; gap:4px; margin-bottom:6px;
}
.sb-label {
  flex:1; font-size:10px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; color:var(--t3);
}
.ib {
  width:22px; height:22px; border-radius:6px;
  background:transparent; border:none; color:var(--t2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:13px; transition: background .15s, color .15s;
}
.ib:hover { background:rgba(255,255,255,.08); color:var(--t1); }

.open-btn {
  display:flex; align-items:center; gap:8px;
  width:100%; padding:7px 10px;
  background: var(--glass-hi);
  border: 1px solid var(--glass-b);
  border-radius: var(--r-sm);
  color:var(--t2); font-family:inherit; font-size:12px;
  cursor:pointer; transition: all .2s;
}
.open-btn:hover { background:var(--glass-hi2); color:var(--t1); }

#fileTree {
  flex:1; overflow-y:auto; padding:3px;
}

/* ─── Tree Items ─── */
.ti {
  display:flex; align-items:center; gap:5px;
  padding:3.5px 8px; border-radius:6px;
  cursor:pointer; transition: background .12s;
  white-space:nowrap; overflow:hidden;
  position:relative;
}
.ti:hover { background:rgba(255,255,255,.055); }
.ti.active {
  background:rgba(0,122,255,.18);
  box-shadow: inset 1px 0 0 var(--blue);
}
.ti .ti-toggle {
  width:13px; font-size:8px; color:var(--t3); flex-shrink:0;
  transition:transform .15s var(--trans);
}
.ti .ti-toggle.open { transform:rotate(90deg); }
.ti .ti-icon { font-size:13px; flex-shrink:0; line-height:1; }
.ti .ti-name {
  font-size:12px; color:var(--t2); overflow:hidden;
  text-overflow:ellipsis; flex:1;
}
.ti.active .ti-name { color:var(--t1); }

.tc { padding-left:12px; display:none; }
.tc.open { display:block; }

/* ─── Empty state ─── */
.sb-empty {
  padding:20px 12px; text-align:center;
  color:var(--t3); font-size:11px; line-height:1.6;
}
.sb-empty .e-icon { font-size:28px; margin-bottom:8px; display:block; opacity:.5; }

/* ═══════════════════════════════════════════
   EDITOR
═══════════════════════════════════════════ */
#editor-area {
  grid-area:editor;
  display:flex; flex-direction:column;
  background:rgba(6,6,14,0.5);
  overflow:hidden;
}

/* Tabs bar */
#tabs-bar {
  display:flex; align-items:center;
  background:rgba(8,8,18,.6);
  border-bottom:1px solid var(--glass-b);
  padding:0 8px; gap:1px;
  min-height:36px; overflow-x:auto; flex-shrink:0;
}
#tabs-bar::-webkit-scrollbar { height:2px; }

.tab {
  display:flex; align-items:center; gap:5px;
  padding:5px 12px 5px 10px; border-radius:8px 8px 0 0;
  cursor:pointer; font-size:11.5px; color:var(--t3);
  white-space:nowrap; border:1px solid transparent; border-bottom:none;
  transition: color .15s, background .15s; flex-shrink:0;
}
.tab:hover { color:var(--t2); background:rgba(255,255,255,.04); }
.tab.active {
  color:var(--t1); background:rgba(255,255,255,.06);
  border-color:var(--glass-b);
}
.tab-x {
  width:14px; height:14px; border-radius:50%; border:none;
  background:transparent; color:var(--t3); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; opacity:0; transition: all .15s; flex-shrink:0;
  font-family:inherit;
}
.tab:hover .tab-x { opacity:1; }
.tab-x:hover { background:rgba(255,69,58,.35); color:var(--red); }
.tab .dot { font-size:8px; color:var(--orange); margin-left:-3px; }

/* Monaco host */
#monaco-host {
  flex:1; overflow:hidden;
}

/* Empty / welcome screen */
#welcome {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:12px; color:var(--t3);
}
.w-logo { font-size:52px; filter:grayscale(40%); }
.w-title { font-size:18px; font-weight:600; color:var(--t2); letter-spacing:-.3px; }
.w-sub { font-size:12px; line-height:1.7; text-align:center; max-width:280px; }
.w-shortcuts {
  margin-top:8px; display:flex; flex-direction:column; gap:5px;
}
.w-sc {
  display:flex; align-items:center; gap:10px;
  font-size:11px; color:var(--t3);
}
.w-sc kbd {
  background:var(--glass-hi); border:1px solid var(--glass-b);
  border-radius:5px; padding:1px 7px; font-family:inherit; font-size:10px; color:var(--t2);
}

/* ═══════════════════════════════════════════
   TERMINAL
═══════════════════════════════════════════ */
#term-area {
  grid-area:term;
  display:flex; flex-direction:column;
  background:rgba(6,6,14,0.75);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-top:1px solid var(--glass-b);
  position:relative;
}

/* resize handle */
#term-resize {
  height:5px; cursor:ns-resize; position:absolute; top:0; left:0; right:0;
  z-index:10;
}
#term-resize::after {
  content:'';
  position:absolute; top:1px; left:50%; transform:translateX(-50%);
  width:36px; height:3px; border-radius:2px;
  background:rgba(255,255,255,.08); transition:background .2s;
}
#term-resize:hover::after { background:rgba(255,255,255,.22); }

#term-header {
  display:flex; align-items:center; gap:8px;
  padding:7px 12px 5px; border-bottom:1px solid rgba(255,255,255,.04);
  flex-shrink:0; margin-top:5px;
}
.term-tabs { display:flex; gap:2px; }
.tt {
  padding:2px 12px; border-radius:6px; font-size:12px;
  cursor:pointer; color:var(--t3); transition:all .15s; border:none; background:transparent;
  font-family:inherit;
}
.tt.active { background:rgba(255,255,255,.08); color:var(--t1); }

.term-right { display:flex; align-items:center; gap:6px; margin-left:auto; }

#shellSel {
  background:rgba(255,255,255,.06); border:1px solid var(--glass-b);
  border-radius:7px; color:var(--t2); font-family:inherit; font-size:11px;
  padding:2px 8px; outline:none; cursor:pointer;
}
#shellSel option { background:#12121e; }

#term-body {
  flex:1; overflow:hidden; padding:6px 4px 4px 8px;
  position:relative;
}
.xterm { height:100%; }
.xterm-viewport { background:transparent !important; border-radius:0 !important; }
.xterm-screen canvas { border-radius:0 !important; }

/* ═══════════════════════════════════════════
   SCROLLBARS
═══════════════════════════════════════════ */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:2px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.2); }

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
#toast {
  position:fixed; bottom:22px; right:22px; z-index:9999;
  background:rgba(22,22,38,0.92);
  backdrop-filter: blur(20px);
  border:1px solid var(--glass-b);
  border-top-color: var(--glass-b-top);
  border-radius:10px; padding:9px 16px;
  font-size:12px; color:var(--t1);
  transform:translateY(70px); opacity:0;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
#toast.show { transform:translateY(0); opacity:1; }

/* ═══════════════════════════════════════════
   CONTEXT MENU
═══════════════════════════════════════════ */
#ctx-menu {
  position:fixed; z-index:9998;
  background:rgba(18,18,32,0.92);
  backdrop-filter: blur(24px);
  border:1px solid var(--glass-b);
  border-top-color:var(--glass-b-top);
  border-radius:var(--r);
  padding:5px;
  display:none; flex-direction:column; gap:1px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  min-width:160px;
}
#ctx-menu.show { display:flex; }
.ctx-item {
  display:flex; align-items:center; gap:9px;
  padding:6px 12px; border-radius:var(--r-xs);
  cursor:pointer; font-size:12px; color:var(--t2);
  transition: background .12s, color .12s;
}
.ctx-item:hover { background:rgba(255,255,255,.07); color:var(--t1); }
.ctx-item.danger:hover { background:rgba(255,69,58,.15); color:var(--red); }
.ctx-sep { height:1px; background:var(--glass-b); margin:3px 0; }
</style>
</head>
<body>

<!-- Animated background -->
<div id="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<div id="app">

  <!-- ══ TITLEBAR ══ -->
  <div id="titlebar">
    <div class="wc">
      <button class="wc-close"  onclick="api.close()"    title="Close"></button>
      <button class="wc-min"    onclick="api.minimize()" title="Minimize"></button>
      <button class="wc-max"    onclick="api.maximize()" title="Maximize"></button>
    </div>

    <span class="logo">⚡ LiteIDE</span>

    <span id="breadcrumb">No file open</span>

    <!-- Language picker -->
    <div id="lang-trigger" onclick="toggleLangMenu()" title="Select language">
      <div class="ldot" id="langDot"></div>
      <span id="langName">Python</span>
      <span class="pill-arrow">▾</span>
    </div>

    <!-- Install banner (shows when lang not installed) -->
    <div id="installBanner" onclick="openInstall()">
      <svg width="10" height="11" viewBox="0 0 10 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 1v6M2 5l3 3 3-3M1 10h8"/></svg>
      <span id="installBannerText">Install Python</span>
    </div>

    <span id="saveBadge">●</span>

    <button id="runBtn" onclick="toggleRun()">
      <svg id="runIcon" width="10" height="12" viewBox="0 0 10 12" fill="currentColor">
        <path d="M1 1l8 5-8 5V1z"/>
      </svg>
      <span id="runLabel">Run</span>
    </button>
  </div>

// ─── xterm ────────────────────────────────
function initXterm() {
  fitAddon = new FitAddon.FitAddon();

  term = new Terminal({
    theme: {
      background:    'transparent',
      foreground:    '#e0e0f0',
      cursor:        '#007AFF',
      cursorAccent:  '#001133',
      selectionBackground: 'rgba(0,122,255,0.28)',
      black:   '#1a1a2e', brightBlack:   '#2a2a4e',
      red:     '#FF453A', brightRed:     '#ff6055',
      green:   '#30D158', brightGreen:   '#40e168',
      yellow:  '#FFD60A', brightYellow:  '#ffe833',
      blue:    '#007AFF', brightBlue:    '#4a90ff',
      magenta: '#BF5AF2', brightMagenta: '#d070ff',
      cyan:    '#5AC8FA', brightCyan:    '#7adaff',
      white:   '#e0e0f0', brightWhite:   '#ffffff',
    },
    fontFamily: '"JetBrains Mono", "Fira Code", Consolas, monospace',
    fontSize: 13,
    lineHeight: 1.55,
    cursorBlink: true,
    cursorStyle: 'block',
    scrollback: 5000,
    allowProposedApi: true,
  });

  term.loadAddon(fitAddon);
  term.open(document.getElementById('term-body'));
  fitAddon.fit();

  // ── Copy / Paste keyboard shortcuts ──
  // Ctrl+Shift+C = copy selection, Ctrl+Shift+V = paste
  // ── Terminal link detection (Ctrl/Cmd+Click or hover) ──
  term.registerLinkProvider({
    provideLinks(y, cb) {
      const line = term.buffer.active.getLine(y - 1);
      if (!line) return cb([]);
      const text = line.translateToString(true);
      const re = /https?:\/\/[^\s\])"'<>]+/g;
      const links = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        const url = m[0];
        links.push({
          text: url,
          range: { start:{x:m.index+1,y}, end:{x:m.index+url.length,y} },
          activate(e, t) { api.openExternal(t); },
          hover(e, t) {
            const el = document.querySelector('.xterm-rows');
            if (el) el.style.cursor = 'pointer';
            // Show tooltip
            let tip = document.getElementById('link-tip');
            if (!tip) { tip=document.createElement('div'); tip.id='link-tip'; tip.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#60a5fa;font-size:11px;padding:3px 10px;border-radius:6px;pointer-events:none;z-index:9999;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'; document.body.appendChild(tip); }
            tip.textContent = t; tip.style.display='block';
          },
          leave() {
            const el = document.querySelector('.xterm-rows');
            if (el) el.style.cursor = '';
            const tip = document.getElementById('link-tip');
            if (tip) tip.style.display='none';
          }
        });
      }
      cb(links);
    }
  });

  document.getElementById('term-body').addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key === 'C') {
      e.preventDefault();
      const sel = term.getSelection();
      if (sel) navigator.clipboard.writeText(sel);
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'V') {
      e.preventDefault();
      navigator.clipboard.readText().then(txt => {
        if (activeTermTab === 'shell') api.shellInput(txt);
        else if (activeTermTab === 'output' && isRunning) api.processInput(txt);
      });
    }
  });

  // ── Right-click context menu ──
  document.getElementById('term-body').addEventListener('contextmenu', e => {
    e.preventDefault();
    const sel = term.getSelection();
    showTermContextMenu(e.clientX, e.clientY, sel);
  });

  // Auto-copy on selection (like most terminals)
  term.onSelectionChange(() => {
    const sel = term.getSelection();
    if (sel) navigator.clipboard.writeText(sel).catch(() => {});
  });

  term.onResize(({ cols, rows }) => api.resizePty(cols, rows));

  // ── Local line buffer — handles backspace/arrows/history without PTY ──
  let lineBuf = '', lineCursor = 0, history = [], histIdx = -1, savedLine = '';

  term.onData(data => {
    if (activeTermTab === 'output') {
      if (isRunning) handleOutputInput(data);
      return;
    }
    // Shell tab: if PTY available, pass straight through (PTY handles editing)
    // otherwise use local line buffer
    if (window._hasPty) api.shellInput(data);
    else handleShellInput(data);
  });


  // ── Output tab: accept stdin when process is running ──
  let outBuf = '', outCursor = 0, outHistory = [], outHistIdx = -1, outSavedLine = '';

  function handleShellInput(data) {
    if (data === '\x03') { api.shellInput('\x03'); term.write('^C\r\n'); lineBuf=''; lineCursor=0; return; }
    if (data === '\x0c') { term.clear(); return; }
    if (data === '\r') {
      term.write('\r\n');
      if (lineBuf.trim()) { history.unshift(lineBuf); if(history.length>200) history.pop(); }
      api.shellInput(lineBuf + '\r\n');
      lineBuf=''; lineCursor=0; histIdx=-1; return;
    }
    if (data === '\x7f' || data === '\b') {
      if (lineCursor>0) { lineBuf=lineBuf.slice(0,lineCursor-1)+lineBuf.slice(lineCursor); lineCursor--;
        term.write('\b'+lineBuf.slice(lineCursor)+' '+'\b'.repeat(lineBuf.length-lineCursor+1)); } return;
    }
    if (data === '\x1b[3~') {
      if (lineCursor<lineBuf.length) { lineBuf=lineBuf.slice(0,lineCursor)+lineBuf.slice(lineCursor+1);
        term.write(lineBuf.slice(lineCursor)+' '+'\b'.repeat(lineBuf.length-lineCursor+1)); } return;
    }
    if (data==='\x1b[D'){if(lineCursor>0){lineCursor--;term.write(data);}return;}
    if (data==='\x1b[C'){if(lineCursor<lineBuf.length){lineCursor++;term.write(data);}return;}
    if (data==='\x1b[A'){if(histIdx===-1)savedLine=lineBuf;if(histIdx<history.length-1){histIdx++;_replaceLineWith(history[histIdx]);}return;}
    if (data==='\x1b[B'){if(histIdx>-1){histIdx--;_replaceLineWith(histIdx===-1?savedLine:history[histIdx]);}return;}
    if (data==='\x1b[H'){term.write('\b'.repeat(lineCursor));lineCursor=0;return;}
    if (data==='\x1b[F'){term.write(lineBuf.slice(lineCursor));lineCursor=lineBuf.length;return;}
    if (data.startsWith('\x1b')) return;
    if (data>=' '||data==='\t') {
      const ins=data==='\t'?'    ':data;
      lineBuf=lineBuf.slice(0,lineCursor)+ins+lineBuf.slice(lineCursor); lineCursor+=ins.length;
      term.write(ins+lineBuf.slice(lineCursor)+(lineCursor<lineBuf.length?'\b'.repeat(lineBuf.length-lineCursor):''));
    }
  }

  function handleOutputInput(data) {
    if (data === '\x03') { api.processInput('\x03'); term.write('^C\r\n'); outBuf = ''; outCursor = 0; return; }
    if (data === '\r') {
      term.write('\r\n');
      if (outBuf.trim()) { outHistory.unshift(outBuf); if (outHistory.length > 200) outHistory.pop(); }
      api.processInput(outBuf + '\n');
      outBuf = ''; outCursor = 0; outHistIdx = -1;
      return;
    }
    if (data === '\x7f' || data === '\b') {
      if (outCursor > 0) {
        outBuf = outBuf.slice(0, outCursor-1) + outBuf.slice(outCursor);
        outCursor--;
        term.write('\b' + outBuf.slice(outCursor) + ' ' + '\b'.repeat(outBuf.length - outCursor + 1));
      }
      return;
    }
    if (data === '\x1b[3~') {
      if (outCursor < outBuf.length) {
        outBuf = outBuf.slice(0, outCursor) + outBuf.slice(outCursor+1);
        term.write(outBuf.slice(outCursor) + ' ' + '\b'.repeat(outBuf.length - outCursor + 1));
      }
      return;
    }
    if (data === '\x1b[D') { if (outCursor > 0) { outCursor--; term.write(data); } return; }
    if (data === '\x1b[C') { if (outCursor < outBuf.length) { outCursor++; term.write(data); } return; }
    if (data === '\x1b[A') {
      if (outHistIdx === -1) outSavedLine = outBuf;
      if (outHistIdx < outHistory.length-1) { outHistIdx++; _replaceOut(outHistory[outHistIdx]); }
      return;
    }
    if (data === '\x1b[B') {
      if (outHistIdx > -1) { outHistIdx--; _replaceOut(outHistIdx === -1 ? outSavedLine : outHistory[outHistIdx]); }
      return;
    }
    if (data === '\x1b[H') { term.write('\b'.repeat(outCursor)); outCursor = 0; return; }
    if (data === '\x1b[F') { term.write(outBuf.slice(outCursor)); outCursor = outBuf.length; return; }
    if (data.startsWith('\x1b')) return;
    if (data >= ' ') {
      outBuf = outBuf.slice(0, outCursor) + data + outBuf.slice(outCursor);
      outCursor++;
      term.write(data + outBuf.slice(outCursor) + (outCursor < outBuf.length ? '\b'.repeat(outBuf.length - outCursor) : ''));
    }
  }

  function _replaceOut(s) {
    term.write('\b'.repeat(outCursor) + s + ' '.repeat(Math.max(0, outBuf.length - s.length)) + '\b'.repeat(Math.max(0, outBuf.length - s.length)));
    outBuf = s; outCursor = s.length;
  }

  // IPC listeners
  api.onShellOutput(data => {
    if (activeTermTab === 'shell') term.write(data);
  });
  api.onShellExit(() => {
    if (activeTermTab === 'shell')
      term.write('\r\n\x1b[33m[Shell exited — click "+" to restart]\x1b[0m\r\n');
  });
  api.onShellError(msg => {
    if (activeTermTab === 'shell')
      term.write(`\r\n\x1b[31m[Shell error: ${msg}]\x1b[0m\r\n`);
  });

  api.onStdout(data => {
    if (activeTermTab === 'output') term.write(data);
  });
  api.onStderr(data => {
    if (activeTermTab === 'output') term.write('\x1b[31m' + data + '\x1b[0m');
  });
  api.onExit(code => {
    isRunning = false;
    updateRunBtn();
    outBuf = ''; outCursor = 0;
    if (activeTermTab === 'output') {
      const ok = code === 0;
      term.write(`\r\n\x1b[${ok?'32':'31'}m${'─'.repeat(40)}\x1b[0m\r\n`);
      term.write(`\x1b[${ok?'32':'31'}m${ok?'✓':'✗'} Process exited with code ${code}\x1b[0m\r\n`);
    }
  });
  api.onRunError(msg => {
    isRunning = false; updateRunBtn(); outBuf = ''; outCursor = 0;
    if (activeTermTab === 'output')
      term.write(`\x1b[31m\r\n✗ Error: ${msg}\x1b[0m\r\n`);
  });

  term.write('\x1b[36;1mLiteIDE\x1b[0m \x1b[2m— Shell ready\x1b[0m\r\n');
}

// ── Terminal right-click context menu ────────────────────────
function showTermContextMenu(x, y, selection) {
  let menu = document.getElementById('term-ctx');
  if (!menu) {
    menu = document.createElement('div');
    menu.id = 'term-ctx';
    menu.style.cssText = `position:fixed;z-index:9999;background:rgba(16,16,30,0.97);
      backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);
      border-top-color:rgba(255,255,255,0.2);border-radius:10px;padding:5px;
      min-width:160px;box-shadow:0 12px 40px rgba(0,0,0,.6);`;
    document.body.appendChild(menu);
  }

  const item = (icon, label, action, disabled) => {
    const el = document.createElement('div');
    el.style.cssText = `display:flex;align-items:center;gap:9px;padding:6px 12px;
      border-radius:6px;cursor:${disabled?'default':'pointer'};font-size:12px;
      color:${disabled?'rgba(255,255,255,.25)':'rgba(255,255,255,.8)'};
      font-family:inherit;transition:background .12s;`;
    el.innerHTML = `<span>${icon}</span><span style="flex:1">${label}</span>`;
    if (!disabled) {
      el.onmouseenter = () => el.style.background = 'rgba(255,255,255,.07)';
      el.onmouseleave = () => el.style.background = '';
      el.onclick = () => { action(); menu.style.display = 'none'; };
    }
    return el;
  };

  const sep = () => {
    const el = document.createElement('div');
    el.style.cssText = 'height:1px;background:rgba(255,255,255,.07);margin:3px 0;';
    return el;
  };

  menu.innerHTML = '';
  menu.appendChild(item('📋', 'Copy', () => {
    const sel = term.getSelection();
    if (sel) navigator.clipboard.writeText(sel);
  }, !selection));
  menu.appendChild(item('📌', 'Paste', () => {
    navigator.clipboard.readText().then(txt => {
      if (activeTermTab === 'shell') api.shellInput(txt);
      else if (activeTermTab === 'output' && isRunning) api.processInput(txt);
    });
  }, false));
  menu.appendChild(item('🔲', 'Select All', () => term.selectAll(), false));
  menu.appendChild(sep());
  menu.appendChild(item('🗑️', 'Clear', () => term.clear(), false));
  if (currentFolder) {
    menu.appendChild(sep());
    menu.appendChild(item('📁', 'CD to Project', () => {
      api.shellInput(`cd "${currentFolder}"\r`);
    }, false));
  }

  menu.style.display = 'block';
  menu.style.left = Math.min(x, window.innerWidth - 170) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight - 220) + 'px';

  setTimeout(() => document.addEventListener('click', () => {
    menu.style.display = 'none';
  }, { once: true }), 50);
}
async function loadShells() {
  const shells = await api.getShells();
  const sel = document.getElementById('shellSel');
  sel.innerHTML = '';
  if (!shells.length) {
    sel.innerHTML = '<option value="">No shell found</option>';
    return;
  }
  shells.forEach(s => {
    const o = document.createElement('option');
    o.value = s.cmd; o.textContent = s.name;
    sel.appendChild(o);
  });
  const r = await api.spawnShell(shells[0].cmd);
  window._hasPty = r && r.hasPty;
  if (currentFolder) cdShellTo(currentFolder);
}

async function changeShell(cmd) {
  if (!cmd) return;
  term.clear();
  const r = await api.spawnShell(cmd);
  window._hasPty = r && r.hasPty;
  if (currentFolder) cdShellTo(currentFolder);
}

async function respawnShell() {
  const sel = document.getElementById('shellSel');
  term.clear();
  if (sel.value) {
    const r = await api.spawnShell(sel.value);
    window._hasPty = r && r.hasPty;
    if (currentFolder) cdShellTo(currentFolder);
  }
}

function switchTab(tab) {
  activeTermTab = tab;
  document.querySelectorAll('.tt').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab)
  );
  term.clear();
  if (tab === 'shell') { term.write('\x1b[36mShell\x1b[0m\r\n'); respawnShell(); }
  updateStdinHint();
}

// ═══════════════════════════════════════════
//  FILE SYSTEM
// ═══════════════════════════════════════════
// CD all shell types to folder after short delay (shell needs time to init)
function cdShellTo(dir) {
  if (!dir) return;
  setTimeout(() => api.shellCd(dir), 700);
}

async function openFolder() {
  const p = await api.openFolder();
  if (!p) return;
  currentFolder = p;
  await refreshTree();
  toast('📂 ' + p.split(/[/\\]/).pop());
  cdShellTo(p);
}

async function refreshTree() {
  if (!currentFolder) return;
  const tree = await api.readDir(currentFolder);
  renderTree(tree, document.getElementById('fileTree'), currentFolder);
}

function renderTree(items, container, basePath) {
  container.innerHTML = '';
  if (!items?.length) {
    container.innerHTML = '<div class="sb-empty">Empty folder</div>';
    return;
  }
  items.forEach(item => renderItem(item, container));
}

function renderItem(item, parent) {
  const wrap = document.createElement('div');

  const el = document.createElement('div');
  el.className = 'ti' + (item.path === activeTab?.path ? ' active' : '');
  el.dataset.path = item.path;

  const toggle = `<span class="ti-toggle">${item.isDir ? '▶' : ''}</span>`;
  const icon   = `<span class="ti-icon">${getIcon(item)}</span>`;
  const name   = `<span class="ti-name">${item.name}</span>`;
  el.innerHTML = toggle + icon + name;

  if (item.isDir) {
    const kids = document.createElement('div');
    kids.className = 'tc';
    let loaded = false;

    el.addEventListener('click', () => {
      const t = el.querySelector('.ti-toggle');
      t.classList.toggle('open');
      kids.classList.toggle('open');
      if (kids.classList.contains('open') && item.children && !loaded) {
        item.children.forEach(c => renderItem(c, kids));
        loaded = true;
      }
    });

    wrap.appendChild(el);
    wrap.appendChild(kids);
  } else {
    el.addEventListener('click', () => openFile(item.path, item.name));
    el.addEventListener('contextmenu', e => showCtxMenu(e, item));
    wrap.appendChild(el);
  }

  parent.appendChild(wrap);
}

function getIcon(item) {
  if (item.isDir) return '📁';
  const ext = '.' + (item.name.split('.').pop() || '').toLowerCase();
  const map = {
    '.py':'🐍', '.js':'🟨', '.ts':'🔷', '.jsx':'⚛️', '.tsx':'⚛️',
    '.html':'🌐', '.css':'🎨', '.scss':'🎨', '.json':'{}',
    '.md':'📝', '.txt':'📄', '.cpp':'⚙️', '.cc':'⚙️', '.c':'⚙️', '.h':'🔩',
    '.rs':'🦀', '.go':'🐹', '.rb':'💎', '.php':'🐘', '.java':'☕',
    '.kt':'🎯', '.swift':'🍎', '.dart':'🎯', '.sh':'🐚', '.ps1':'💙',
    '.r':'📊', '.lua':'🌙', '.vue':'💚', '.svelte':'🔥', '.sql':'🗃️',
    '.yml':'📋', '.yaml':'📋', '.toml':'📋', '.env':'🔐', '.lock':'🔒',
    '.dockerfile':'🐳', '.gitignore':'👁️', '.zig':'⚡', '.jl':'🟣', '.nim':'👑',
  };
  return map[ext] || '📄';
}

async function openFile(filePath, fileName) {
  // Already open?
  const existing = tabs.find(t => t.path === filePath);
  if (existing) { activateTabObj(existing); return; }

  const content = await api.readFile(filePath);
  if (content === null) { toast('❌ Cannot read file'); return; }

  const ext = '.' + filePath.split('.').pop().toLowerCase();
  const lang = EXT_TO_LANG[ext] || currentLang;
  const monacoLang = MONACO_LANG[lang] || 'plaintext';

  const model = monaco.editor.createModel(content, monacoLang);
  const tab = { path: filePath, name: fileName, model, unsaved: false, lang };
  models.set(filePath, model);
  tabs.push(tab);
  activateTabObj(tab);

  // Auto-set language selector
  if (EXT_TO_LANG[ext]) {
    document.getElementById('langSelect').value = lang;
    currentLang = lang;
    checkLang(lang);
  }
}

function activateTabObj(tab) {
  activeTab = tab;

  // Update tree highlight
  document.querySelectorAll('.ti').forEach(el =>
    el.classList.toggle('active', el.dataset.path === tab.path)
  );

  // Show editor
  document.getElementById('welcome').style.display    = 'none';
  document.getElementById('monaco-host').style.display = 'flex';

  if (editor) editor.setModel(tab.model);

  // Breadcrumb
  const parts = tab.path.replace(/\\/g, '/').split('/');
  const dir = parts.slice(-2, -1)[0] || '';
  document.getElementById('breadcrumb').innerHTML =
    `<span>${dir}</span>  /  ${tab.name}`;

  refreshTabsBar();
}

function refreshTabsBar() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = '';
  tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab' + (tab === activeTab ? ' active' : '');
    el.innerHTML = `
      <span style="font-size:12px">${getIcon({name:tab.name,isDir:false})}</span>
      <span>${tab.name}${tab.unsaved ? '<span class="dot"> ●</span>' : ''}</span>
      <button class="tab-x" data-path="${tab.path}">✕</button>
    `;
    el.addEventListener('click', e => {
      if (e.target.classList.contains('tab-x') || e.target.dataset.path) return;
      activateTabObj(tab);
    });
    el.querySelector('.tab-x').addEventListener('click', () => closeTab(tab.path));
    bar.appendChild(el);
  });
}

function closeTab(filePath) {
  const idx = tabs.findIndex(t => t.path === filePath);
  if (idx === -1) return;

  // Dispose model
  const m = models.get(filePath);
  if (m) { m.dispose(); models.delete(filePath); }
  tabs.splice(idx, 1);

  if (activeTab?.path === filePath) {
    if (tabs.length) {
      activateTabObj(tabs[Math.max(0, idx - 1)]);
    } else {
      activeTab = null;
      document.getElementById('welcome').style.display    = 'flex';
      document.getElementById('monaco-host').style.display = 'none';
      document.getElementById('breadcrumb').textContent  = 'No file open';
      if (editor) editor.setModel(null);
    }
  }

  refreshTabsBar();
}

// Auto-save (debounced 1.2s)
let saveTimer = null;
function debouncedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveFile, 1200);
}

async function saveFile() {
  if (!activeTab || !editor) return;
  const content = editor.getValue();
  const ok = await api.writeFile(activeTab.path, content);
  if (ok) {
    activeTab.unsaved = false;
    refreshTabsBar();
    const b = document.getElementById('saveBadge');
    b.textContent = '✓ Saved'; b.classList.add('ok');
    setTimeout(() => { b.textContent = '●'; b.classList.remove('ok'); }, 1800);
  }
}

async function newFile() {
  if (!currentFolder) { toast('Open a folder first'); return; }
  const fp = await api.newFile(currentFolder);
  if (fp) {
    await refreshTree();
    await openFile(fp, fp.split(/[/\\]/).pop());
  }
}

// ═══════════════════════════════════════════

  {name:'Python',     icon:'🐍'}, {name:'JavaScript', icon:'🟨'},
  {name:'TypeScript', icon:'🔷'}, {name:'Go',         icon:'🐹'},
  {name:'Rust',       icon:'🦀'}, {name:'C++',        icon:'⚙️'},
  {name:'C',          icon:'⚙️'}, {name:'Java',       icon:'☕'},
  {name:'Ruby',       icon:'💎'}, {name:'PHP',        icon:'🐘'},
  {name:'Swift',      icon:'🍎'}, {name:'Kotlin',     icon:'🎯'},
  {name:'Dart',       icon:'🎯'}, {name:'R',          icon:'📊'},
  {name:'Perl',       icon:'🐪'}, {name:'Bash',       icon:'🐚'},
  {name:'PowerShell', icon:'💙'}, {name:'Lua',        icon:'🌙'},
  {name:'Elixir',     icon:'💜'}, {name:'Haskell',    icon:'λ'},
  {name:'Zig',        icon:'⚡'}, {name:'Julia',      icon:'🟣'},
  {name:'Nim',        icon:'👑'}, {name:'C#',         icon:'🟦'},
  {name:'F#',         icon:'🟩'}, {name:'Deno',       icon:'🦕'},
  {name:'HTML',       icon:'🌐'}, {name:'CSS',        icon:'🎨'},
  {name:'Markdown',   icon:'📝'}, {name:'JSON',       icon:'{}'},
  {name:'SQL',        icon:'🗄️'}, {name:'Vue',        icon:'💚'},
  {name:'Svelte',     icon:'🔥'}, {name:'GraphQL',    icon:'💠'},
];

// cache: name -> {installed, installLink}
const langStatus = {};

async function initLangStatuses() {
  // Detect all languages in background, update UI as results come in
  for (const l of LANG_LIST) {
    langStatus[l.name] = { installed: null }; // null = loading
    api.detectLang(l.name).then(res => {
      langStatus[l.name] = res;
      // re-render list if open
      if (document.getElementById('lang-menu').classList.contains('open')) renderLangList();
      // update titlebar dot if this is current
      if (l.name === currentLang) updateTitlebarDot();
    });
  }
}

function updateTitlebarDot() {
  const dot = document.getElementById('langDot');
  const banner = document.getElementById('installBanner');
  const st = langStatus[currentLang];
  if (!st || st.installed === null) {
    dot.className = 'ldot loading'; banner.style.display = 'none';
  } else if (st.installed) {
    dot.className = 'ldot ok';
    langInstalled = true; banner.style.display = 'none';
  } else {
    dot.className = 'ldot bad';
    langInstalled = false;
    installUrl = st.installLink || null;
    document.getElementById('installBannerText').textContent = `Install ${currentLang}`;
    banner.style.display = 'flex';
  }
}

function toggleLangMenu() {
  const menu = document.getElementById('lang-menu');
  if (menu.classList.contains('open')) {
    closeLangMenu(); return;
  }
  menu.classList.add('open');
  document.getElementById('lang-search').value = '';
  renderLangList('');
  setTimeout(() => document.getElementById('lang-search').focus(), 50);
  setTimeout(() => document.addEventListener('click', outsideLangClick), 50);
}

function closeLangMenu() {
  document.getElementById('lang-menu').classList.remove('open');
  document.removeEventListener('click', outsideLangClick);
}

function outsideLangClick(e) {
  if (!document.getElementById('lang-menu').contains(e.target) &&
      !document.getElementById('lang-trigger').contains(e.target)) {
    closeLangMenu();
  }
}

function filterLangs(q) { renderLangList(q); }

function renderLangList(q = '') {
  const list = document.getElementById('lang-list');
  const filtered = q
    ? LANG_LIST.filter(l => l.name.toLowerCase().includes(q.toLowerCase()))
    : LANG_LIST;

  list.innerHTML = filtered.map(l => {
    const st = langStatus[l.name];
    const isLoading = !st || st.installed === null;
    const installed = st?.installed;
    const link = st?.installLink;
    const isCurrent = l.name === currentLang;

    const dotClass = isLoading ? 'spin' : installed ? 'ok' : 'bad';
    const badge = isLoading
      ? `<span class="li-dot spin"></span>`
      : installed
        ? `<span class="li-badge ok">✓ ready</span>`
        : `<span class="li-badge bad">✗ missing</span>`;

    const getBtn = (!isLoading && !installed && link)
      ? `<span class="li-get" onclick="event.stopPropagation();api.openExternal('${link}')">Get ↗</span>`
      : '';

    return `<div class="li ${isCurrent ? 'selected' : ''}" onclick="selectLang('${l.name}')">
      <span class="li-icon">${l.icon}</span>
      <span class="li-name">${l.name}</span>
      <span class="li-status">${badge}${getBtn}</span>
    </div>`;
  }).join('');
}

function selectLang(lang) {
  currentLang = lang;
  document.getElementById('langName').textContent = lang;
  closeLangMenu();
  updateTitlebarDot();
  if (editor && activeTab) {
    monaco.editor.setModelLanguage(editor.getModel(), MONACO_LANG[lang] || 'plaintext');
    activeTab.lang = lang;
  }
}

// kept for compatibility
async function checkLang(lang) {
  currentLang = lang;
  document.getElementById('langName').textContent = lang;
  const st = langStatus[lang];
  if (st && st.installed !== null) {
    langInstalled = st.installed;
    installUrl = st.installLink || null;
    updateTitlebarDot();
  }
}

function openInstall() {
  if (installUrl) api.openExternal(installUrl);
}

  // Show subtle "▸ stdin ready" hint when output tab is focused and process running
  function updateStdinHint() {
    const hdr = document.getElementById('term-header');
    let badge = document.getElementById('stdin-badge');
    if (isRunning && activeTermTab === 'output') {
      if (!badge) {
        badge = document.createElement('span');
        badge.id = 'stdin-badge';
        badge.style.cssText = 'font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(0,122,255,.18);color:#60a5fa;border:1px solid rgba(0,122,255,.3);animation:stdinBlink 1.5s ease-in-out infinite;';
        badge.textContent = '▸ stdin';
        hdr.appendChild(badge);
      }
    } else {
      badge?.remove();
    }
  }

  // patch toggleRun and switchTab to update hint
  const _origUpdateRunBtn = updateRunBtn;
  updateRunBtn = function() { _origUpdateRunBtn(); updateStdinHint(); };
async function toggleRun() {
  if (isRunning) {
    await api.stopCode();
    isRunning = false;
    updateRunBtn();
    return;
  }

  if (!activeTab) { toast('Open a file first'); return; }
  if (!langInstalled) {
    toast(`${currentLang} not installed`);
    openInstall();
    return;
  }

  await saveFile();

  // Switch to output
  switchTab('output');
  term.clear();
  term.write(`\x1b[36;1m▶ Running\x1b[0m \x1b[37m${activeTab.name}\x1b[0m\r\n\r\n`);

  isRunning = true;
  updateRunBtn();

  await api.runCode(activeTab.path, currentLang);
}

function updateRunBtn() {
  const btn = document.getElementById('runBtn');
  const icon = document.getElementById('runIcon');
  const label = document.getElementById('runLabel');

  if (isRunning) {
    btn.classList.add('stop');
    icon.innerHTML = '<rect x="2" y="2" width="8" height="8" rx="1"/>';
    label.textContent = 'Stop';
  } else {
    btn.classList.remove('stop');
    icon.innerHTML = '<path d="M1 1l8 5-8 5V1z"/>';
    label.textContent = 'Run';
  }
}

// ═══════════════════════════════════════════
//  TERMINAL RESIZE
// ═══════════════════════════════════════════
function setupTerminalResize() {
  const handle = document.getElementById('term-resize');
  let startY, startH;

  handle.addEventListener('mousedown', e => {
    startY = e.clientY;
    startH = document.getElementById('term-area').offsetHeight;
    document.body.style.cursor = 'ns-resize';

    const onMove = e => {
      const delta = startY - e.clientY;
      const newH = Math.max(80, Math.min(window.innerHeight * 0.7, startH + delta));
      document.documentElement.style.setProperty('--terminal-h', newH + 'px');
    };
    const onUp = () => {
      document.body.style.cursor = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (fitAddon) fitAddon.fit();
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  window.addEventListener('resize', () => {
    if (fitAddon) fitAddon.fit();
  });
}

// ═══════════════════════════════════════════
//  CONTEXT MENU
// ═══════════════════════════════════════════
function showCtxMenu(e, item) {
  e.preventDefault();
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = `
    <div class="ctx-item" onclick="openFile('${item.path.replace(/'/g,"\\'")}','${item.name.replace(/'/g,"\\'")}')">
      <span>📂</span> Open
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" onclick="deleteFileCtx('${item.path.replace(/'/g,"\\'")}')">
      <span>🗑️</span> Delete
    </div>
  `;
  menu.style.left = e.clientX + 'px';
  menu.style.top  = e.clientY + 'px';
  menu.classList.add('show');
  setTimeout(() => document.addEventListener('click', hideCtxMenu, {once:true}), 50);
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').classList.remove('show');
}

async function deleteFileCtx(filePath) {
  hideCtxMenu();
  const ok = await api.deleteFile(filePath);
  if (ok) {
    closeTab(filePath);
    await refreshTree();
    toast('🗑️ Deleted');
  }
}

// ═══════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════
let toastTimer;
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ═══════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
  const mod = platform === 'darwin' ? e.metaKey : e.ctrlKey;
  if (mod && e.key === 's') { e.preventDefault(); saveFile(); }
  if (mod && e.key === 'o') { e.preventDefault(); openFolder(); }
  if (mod && e.key === 'Enter') { e.preventDefault(); toggleRun(); }
  if (mod && e.key === 'w') { e.preventDefault(); if (activeTab) closeTab(activeTab.path); }
  if (e.key === 'Escape') hideCtxMenu();
});

//  BOOT
// ═══════════════════════════════════════════
init();
